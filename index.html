# מטבוחה חריפה

רוטב עגבניות מבושל עם פלפל חריף — קלאסיקה מרוקאית שמרוחה על לחם טרי.

## מצרכים

- 6 עגבניות בשלות גדולות
- 2 פלפל אדום גדול
- 3 פלפל חריף (כוסברה / ג'לפניו)
- 4 כפות שמן זית
- 5 שיני שום
- 1 כפית כמון
- 1 כפית פפריקה מתוקה
- ½ כפית פפריקה חריפה
- 1 כפית מלח
- ½ כפית סוכר
- ¼ כוס עלי כוסברה טריה

## הוראות הכנה

1. **צלייה על להבה** — מניחים את העגבניות, הפלפל האדום והפלפל החריף ישירות על הלהבה הגבוהה וצולים עד שהקליפה משחירה ומתפצחת מכל הצדדים. הופכים מדי פעם עם מלקחיים.

2. **קילוף** — מעבירים את הירקות הצלויים לקערה ומכסים בניילון נצמד למשך 10 דקות. לאחר מכן מקלפים את הקליפה השרופה, מסירים הגרעינים מהפלפלים ומנקים בעדינות.

3. **קיצוץ גס** — קוצצים את הירקות הקלופים בסכין לחתיכות גסות — לא בבלנדר. המטבוחה צריכה להיות עם מרקם גס ולא חלק לגמרי.

4. **בישול עם שמן ושום** — מחממים שמן זית במחבת גדולה על אש בינונית. מוסיפים שום כתוש ומטגנים דקה עד שמזהיב. מוסיפים את הירקות הקצוצים ומערבבים.

5. **תיבול ובישול ארוך** — מוסיפים כמון, פפריקה מתוקה, פפריקה חריפה, מלח וסוכר. מבשלים על אש נמוכה תוך ערבוב מדי פעם כ-40 דקות עד שהנוזלים מתאדים והמטבוחה מסמיכה ומבריקה בשמן.

6. **הגשה** — מצננים מעט, מפזרים כוסברה קצוצה ומגישים עם לחם פיתה טרי או לחם מרוקאי (כסרה). טעים גם חם וגם בטמפרטורת החדר.

## טיפים

> הסוד: אל תחסכו בזמן הבישול — ככל שמבשלים יותר זמן, הטעמים מתרכזים ומעמיקים. רמת החריפות ניתנת לכוונון לפי כמות הפלפל החריף.`

# סלט גזר מרוקאי

סלט גזר מבושל עם כמון ולימון — פשוט, עסיסי ומרענן.

## מצרכים

- 6 גזרים
- 3 כפות שמן זית
- 3 כפות מיץ לימון טרי
- 3 שיני שום כתוש

// ── PARSE FRONTMATTER ─────────────────────────────────────────────────────
function parseFrontmatter(raw) {
  const match = raw.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!match) return { meta: {}, body: raw };
  const meta = {};
  match[1].split('\n').forEach(line => {
    const [k, ...vs] = line.split(':');
    if (!k) return;
    let v = vs.join(':').trim();
    if (v.startsWith('[') && v.endsWith(']')) {
      v = v.slice(1,-1).split(',').map(t => t.trim());
    }
    meta[k.trim()] = v;
  });
  return { meta, body: match[2] };
}

// ── BUILD RECIPE LIST ─────────────────────────────────────────────────────
const recipes = RECIPES_RAW.map(r => {
  const { meta, body } = parseFrontmatter(r.content);
  return { ...meta, body, filename: r.filename,
    tags: Array.isArray(meta.tags) ? meta.tags : (meta.tags ? [meta.tags] : []) };
});

let activeTag = null;
let activeRecipe = null;

// ── ALL TAGS ──────────────────────────────────────────────────────────────
function getAllTags() {
  const set = new Set();
  recipes.forEach(r => r.tags.forEach(t => set.add(t)));
  return [...set];
}

// ── RENDER SIDEBAR ────────────────────────────────────────────────────────
function renderSidebar(filtered) {
  const list = document.getElementById('recipe-list');
  const groups = {};
  filtered.forEach(r => {
    const cat = r.category || 'כללי';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(r);
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-results">לא נמצאו מתכונים</div>';
    return;
  }

  list.innerHTML = Object.entries(groups).map(([cat, items]) => `
    <div class="category-section">
      <div class="category-label">${cat}</div>
      ${items.map(r => {
        const idx = recipes.indexOf(r);
        return `
        <div class="recipe-item ${r === activeRecipe ? 'active' : ''}"
             onclick="showRecipe(${idx})">
          <input type="checkbox" class="item-check" ${selectedRecipes.has(idx) ? 'checked' : ''}
            onclick="event.stopPropagation(); toggleSelect(${idx}, this.checked)">
          <div class="recipe-item-text">
            <div class="recipe-item-name">${r.title || r.filename}</div>
            <div class="recipe-item-meta">${r.time || ''} ${r.servings ? '· ' + r.servings + ' מנות' : ''}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `).join('');
}

// ── RENDER TAGS ───────────────────────────────────────────────────────────
function renderTags() {
  const tags = getAllTags();
  const wrap = document.getElementById('tags-filter');
  wrap.innerHTML = tags.map(t => `
    <button class="tag-btn ${activeTag === t ? 'active' : ''}" onclick="toggleTag('${t}')">${t}</button>
  `).join('');
}

function toggleTag(tag) {
  activeTag = activeTag === tag ? null : tag;
  renderTags();
  filterRecipes();
}

// ── FILTER ────────────────────────────────────────────────────────────────
function filterRecipes() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let filtered = recipes;
  if (activeTag) filtered = filtered.filter(r => r.tags.includes(activeTag));
  if (q) filtered = filtered.filter(r =>
    (r.title||'').toLowerCase().includes(q) ||
    (r.category||'').toLowerCase().includes(q) ||
    r.tags.some(t => t.toLowerCase().includes(q)) ||
    r.body.toLowerCase().includes(q)
  );
  renderSidebar(filtered);
}

// ── SHOW RECIPE ───────────────────────────────────────────────────────────
function showRecipe(index) {
  activeRecipe = recipes[index];
  filterRecipes();

  const r = activeRecipe;
  const html = marked.parse(r.body);

  const tagsHtml = r.tags.map(t =>
    `<span class="recipe-tag">${t}</span>`
  ).join('');

  document.getElementById('main-content').innerHTML = `
    <div class="recipe-view">
      <div class="recipe-header">
        ${r.category ? `<div class="recipe-category-badge">${r.category}</div>` : ''}
        <h1 class="recipe-title">${r.title || r.filename}</h1>
        <div class="recipe-meta-row">
          ${r.time ? `<div class="meta-pill">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ${r.time}
          </div>` : ''}
          ${r.servings ? `<div class="meta-pill">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            ${r.servings} מנות
          </div>` : ''}
        </div>
        ${tagsHtml ? `<div class="recipe-tags-row">${tagsHtml}</div>` : ''}
      </div>
      <div class="recipe-body">${html}</div>
    </div>
  `;
}

function showWelcome() {
  activeRecipe = null;
  filterRecipes();
  document.getElementById('main-content').innerHTML = `
    <div class="welcome" id="welcome-screen">
      <div class="welcome-icon">🥘</div>
      <h2>ספר המתכונים שלי</h2>
      <p>בחר מתכון מהרשימה כדי להתחיל</p>
    </div>
  `;
}

// ── SHOPPING LIST ─────────────────────────────────────────────────────────
const selectedRecipes = new Set();

// Pantry staples: show as "required" without amount
const PANTRY_KEYWORDS = ['מלח', 'סוכר', 'כמון', 'פפריקה', 'חומץ'];

function isPantry(ingredient) {
  return PANTRY_KEYWORDS.some(k => ingredient.includes(k));
}

function toggleSelect(index, checked) {
  if (checked) selectedRecipes.add(index);
  else selectedRecipes.delete(index);
  const btn = document.getElementById('shop-btn');
  const count = selectedRecipes.size;
  btn.style.display = count > 0 ? 'flex' : 'none';
  document.getElementById('shop-count').textContent = count;
}

function parseIngredients(body) {
  const match = body.match(/##\s*מצרכים\n([\s\S]*?)(?=\n##|$)/);
  if (!match) return [];
  return match[1].split('\n')
    .filter(l => l.trim().startsWith('-'))
    .map(l => l.replace(/^-\s*/, '').trim())
    .filter(Boolean);
}

function openShoppingList() {
  const pantrySet = new Set();
  const regularItems = [];

  selectedRecipes.forEach(idx => {
    parseIngredients(recipes[idx].body).forEach(ing => {
      if (isPantry(ing)) {
        const keyword = PANTRY_KEYWORDS.find(k => ing.includes(k));
        if (keyword) pantrySet.add(keyword);
      } else {
        regularItems.push(ing);
      }
    });
  });

  const names = [...selectedRecipes].map(i => recipes[i].title).join(' + ');
  let html = `<div class="shop-for">עבור: ${names}</div>`;

  if (regularItems.length) {
    html += `<div class="shop-section-title">מרכיבים</div>`;
    regularItems.forEach(ing => {
      html += `<div class="shop-item">${ing}</div>`;
    });
  }

  if (pantrySet.size) {
    html += `<div class="shop-section-title">תבלינים ומלאי בסיסי</div>`;
    [...pantrySet].forEach(p => {
      html += `<div class="shop-item"><span class="shop-pantry-badge">נדרש</span>${p}</div>`;
    });
  }

  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeShoppingList() {
  document.getElementById('modal-overlay').classList.remove('open');
}

// ── INIT ──────────────────────────────────────────────────────────────────
renderTags();
filterRecipes();
</script>
